name: Pull Request Workflow

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Enforce Conventional Commits
        run: |
          ./verify-commit-messages.sh
        
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
          
      - name: Select Simulator
        run: |
          # Pick an available iPhone on the newest installed iOS runtime and target it by UDID,
          # so the destination can't resolve to a device that only exists on an older runtime.
          simulator_id=$(xcrun simctl list devices available -j | ruby -rjson -e '
            runtimes = JSON.parse(STDIN.read)["devices"].select { |runtime, devices| runtime.include?("SimRuntime.iOS-") && devices.any? { |d| d["name"].start_with?("iPhone") } }
            abort "No available iPhone simulators found" if runtimes.empty?
            _, devices = runtimes.max_by { |runtime, _| runtime[/iOS-([\d-]+)/, 1].split("-").map(&:to_i) }
            device = devices.find { |d| d["name"].start_with?("iPhone") }
            STDERR.puts "Using simulator: #{device["name"]} (#{device["udid"]})"
            puts device["udid"]')
          echo "SIMULATOR_ID=$simulator_id" >> $GITHUB_ENV

      - name: Build
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; 
          fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,id=$SIMULATOR_ID"

      - name: Test
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; 
          fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test-without-building -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,id=$SIMULATOR_ID"

