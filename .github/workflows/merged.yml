name: Deployment Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy to App Store and TestFlight
    runs-on: macos-latest
    env:
      # Hosted runners can take well over fastlane's default 3s (doubling over
      # 4 retries) to answer `xcodebuild -showBuildSettings`, especially while
      # simulators are booting for screenshot generation.
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Install Bundler
        run: gem install bundler

      - name: Install dependencies
        run: bundle install

      - name: Save Certificate
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
        run: |
          echo -n "$CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/distribution.p12"

      - name: Upload to App Store (Fastlane)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12" bundle exec fastlane ios release

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/distribution.p12"
